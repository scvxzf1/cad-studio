[project]
name = "cad-studio"
version = "0.4.0"
description = "Agentic Structural CAD Studio: STEP/STL/3MF parametric modeling, reverse inspection, 10-view blueprint, volumetric diff, DFM printability, multi-part assembly & hot MCP server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.8.0",
    "trimesh>=4.4.0",
    "manifold3d>=2.5.0",
    "shapely>=2.0.0",
    "scipy>=1.13.0",
    "networkx>=3.2",
    "rtree>=1.2.0",
    "pyvista>=0.44.0",
    "matplotlib>=3.9.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "mcp>=2.0.0",
]

[project.scripts]
cad-cli = "cad_kit.cli:main"
cad-mcp = "cad_kit.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad_kit"]
